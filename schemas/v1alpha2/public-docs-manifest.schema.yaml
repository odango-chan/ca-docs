$schema: https://json-schema.org/draft/2020-12/schema
$id: https://connectionagent.io/schemas/v1alpha2/public-docs-manifest.schema.yaml
title: PublicDocsManifest v1alpha2
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
  - component
  - sources
  - releases
properties:
  apiVersion:
    const: connectionagent.io/v1alpha2
  kind:
    const: PublicDocsManifest
  component:
    type: string
    pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  title:
    type: object
    additionalProperties: false
    properties:
      zh: {type: string, minLength: 1}
      en: {type: string, minLength: 1}
  sources:
    type: array
    items:
      $ref: '#/$defs/source'
  releases:
    type: array
    items:
      $ref: '#/$defs/release'
allOf:
  - anyOf:
      - properties:
          sources: {minItems: 1}
      - properties:
          releases: {minItems: 1}
$defs:
  source:
    type: object
    additionalProperties: false
    required: [kind, path, role, publish]
    properties:
      kind:
        enum: [openapi, json-schema, markdown, implementation-check]
      path:
        type: string
        minLength: 1
        pattern: '^(?!/)(?!.*\.\./)(?!.*\\).+$'
      role:
        type: string
        minLength: 1
      language:
        enum: [zh, en]
      extractor:
        enum: [go-http-routes]
      publish:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum:
            - metadata
            - operations
            - fields
            - enums
            - examples
            - body
            - implementation-summary
            - raw
    allOf:
      - if:
          properties:
            kind: {const: implementation-check}
          required: [kind]
        then:
          properties:
            publish:
              items: {enum: [metadata, implementation-summary]}
      - if:
          properties:
            kind: {const: markdown}
          required: [kind]
        then:
          properties:
            publish:
              items: {enum: [metadata, body]}
      - if:
          properties:
            kind: {const: openapi}
          required: [kind]
        then:
          properties:
            publish:
              items: {enum: [metadata, operations, fields, enums, examples, raw]}
      - if:
          properties:
            kind: {const: json-schema}
          required: [kind]
        then:
          properties:
            publish:
              items: {enum: [metadata, fields, enums, examples, raw]}
  release:
    type: object
    additionalProperties: false
    required: [releaseId, releaseRecord, contracts]
    properties:
      releaseId:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      releaseRecord:
        type: object
        additionalProperties: false
        required: [path, ref]
        properties:
          path:
            type: string
            minLength: 1
            pattern: '^(?!/)(?!.*\.\./)(?!.*\\).+$'
          ref:
            type: string
            pattern: '^[0-9a-f]{40}$'
      contracts:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/contract'
  contract:
    type: object
    additionalProperties: false
    required: [contractId, version, lifecycleStatus, source, artifacts]
    properties:
      contractId:
        type: string
        pattern: '^[a-z0-9]+(?:[.-][a-z0-9]+)*$'
      version:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
      lifecycleStatus:
        enum: [DRAFT, ACCEPTED, FROZEN, DEPRECATED]
      source:
        type: object
        additionalProperties: false
        required: [ref]
        properties:
          ref:
            type: string
            pattern: '^[0-9a-f]{40}$'
      artifacts:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/artifact'
  artifact:
    type: object
    additionalProperties: false
    required: [kind, path, mediaType, publish]
    properties:
      kind:
        enum: [openapi, json-schema, markdown, specification, protobuf, asyncapi, other]
      path:
        type: string
        minLength: 1
        pattern: '^(?!/)(?!.*\.\./)(?!.*\\).+$'
      mediaType:
        type: string
        minLength: 1
      publish:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          enum: [download, render]
        contains:
          const: download
