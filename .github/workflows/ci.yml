name: Validate CA Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'data/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build static site from published snapshots
        run: npm run build
