name: Sync Upstream Contracts

# Successful completion is consumed by Deploy CA Docs via workflow_run.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'
      - 'scripts/sync*.mjs'
      - 'data/components.yaml'

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh private upstream snapshots and released contracts
        run: npm run sync
        env:
          CA_DOCS_SOURCE_TOKEN: ${{ secrets.CA_DOCS_SOURCE_TOKEN }}
          CA_DOCS_SYNC_STRICT: '1'

      - name: Verify immutable source provenance
        run: node scripts/verify-snapshot-provenance.mjs
        env:
          CA_DOCS_SOURCE_TOKEN: ${{ secrets.CA_DOCS_SOURCE_TOKEN }}

      - name: Commit sanitized snapshots and public contract artifacts when changed
        shell: bash
        run: |
          rm -rf /tmp/ca-docs-generated /tmp/ca-docs-contracts /tmp/ca-docs-api-snapshots
          mkdir -p /tmp/ca-docs-generated /tmp/ca-docs-contracts /tmp/ca-docs-api-snapshots
          cp -a data/generated/. /tmp/ca-docs-generated/
          if [ -d public/contracts ]; then cp -a public/contracts/. /tmp/ca-docs-contracts/; fi
          if [ -d public/api-snapshots ]; then cp -a public/api-snapshots/. /tmp/ca-docs-api-snapshots/; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data/generated public/contracts public/api-snapshots
            mkdir -p data/generated public/contracts public/api-snapshots
            cp -a /tmp/ca-docs-generated/. data/generated/
            cp -a /tmp/ca-docs-contracts/. public/contracts/
            cp -a /tmp/ca-docs-api-snapshots/. public/api-snapshots/

            if git diff --quiet -- data/generated public/contracts public/api-snapshots; then
              echo "No published snapshot changes."
              exit 0
            fi

            git add data/generated public/contracts public/api-snapshots
            git commit -m "chore: refresh public docs snapshots"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; retrying ($attempt/3)."
          done

          echo "Unable to publish snapshot after 3 attempts."
          exit 1
